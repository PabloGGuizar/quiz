<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: El Sistema Solar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor-principal">
        <h1 class="titulo-quiz">🚀 Quiz: Exploradores del Sistema Solar</h1>
        
        <div id="mensaje-error" class="alerta alerta-error"></div>
        <div id="mensaje-exito" class="alerta alerta-exito"></div>

        <div class="card" id="quiz-container">
            <form id="formulario-quiz">
                <div class="seccion">
                    <h3>1. Identificación</h3>
                    <p class="nota">Si es tu primer intento, ingresa un nombre de usuario. Si ya hiciste el quiz, ingresa tu correo y contraseña (dejando el nombre de usuario vacío).</p>
                    
                    <div class="grupo-input">
                        <input type="text" id="username" placeholder="Nombre de Usuario (Solo primer intento)">
                    </div>
                    <div class="grupo-input">
                        <input type="email" id="email" placeholder="Correo Electrónico (Requerido)" required>
                    </div>
                    <div class="grupo-input">
                        <input type="password" id="password" placeholder="Contraseña (Requerida)" required>
                    </div>
                </div>

                <div class="seccion">
                    <h3>2. Preguntas</h3>
                    
                    <div class="grupo-input">
                        <label>1. ¿Cuál es el planeta más grande de nuestro Sistema Solar?</label>
                        <select id="p1">
                            <option value="A">Saturno</option>
                            <option value="B">Júpiter</option>
                            <option value="C">Neptuno</option>
                        </select>
                    </div>

                    <div class="grupo-input">
                        <label>2. ¿Qué planeta es conocido como el "Planeta Rojo"?</label>
                        <select id="p2">
                            <option value="A">Marte</option>
                            <option value="B">Venus</option>
                            <option value="C">Mercurio</option>
                        </select>
                    </div>

                    <div class="grupo-input">
                        <label>3. ¿Cuál es el planeta más cercano al Sol?</label>
                        <select id="p3">
                            <option value="A">Tierra</option>
                            <option value="B">Venus</option>
                            <option value="C">Mercurio</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="btn-enviar" class="btn-primario">Enviar Respuestas</button>
            </form>
        </div>

        <div class="card" id="leaderboard" style="display: none;">
            <h2 class="titulo-leaderboard">🏆 Top Exploradores</h2>
            <div class="tabla-contenedor">
                <table id="tabla-posiciones">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Mejor Puntaje</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
            <button onclick="reiniciarPantalla()" class="btn-secundario">Hacer otro intento</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
